<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Monitoring Presensi SPPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="glass-card p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border border-gray-100">
        <div class="flex justify-center items-center gap-6 mb-8">
            <img src="logo-unu.png" alt="Logo UNU" class="h-16 object-contain">
            <div class="h-10 w-px bg-gray-300"></div>
            <img src="logo-bgn.png" alt="Logo BGN" class="h-16 object-contain">
        </div>

        <h1 class="text-xl font-extrabold text-gray-800 mb-2">SPPG NOGOTIRTO</h1>
        <p class="text-gray-500 text-sm mb-8 italic">"Sinergi UNU Yogyakarta & Badan Gizi Nasional untuk Indonesia Sehat"</p>

        <div class="space-y-4">
            <div class="relative text-left">
                <label class="text-xs font-bold text-gray-400 uppercase ml-1">Kata Sandi Akses</label>
                <div class="relative mt-1">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="passInput" 
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 transition" 
                        placeholder="Masukkan sandi...">
                </div>
            </div>

            <button onclick="checkLogin()" 
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-2xl shadow-lg transform transition active:scale-95">
                BUKA DASHBOARD
            </button>
            
            <p id="errorMsg" class="text-red-500 text-xs mt-2 hidden">Kata sandi salah, silakan coba lagi.</p>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL DEPLOY GOOGLE APPS SCRIPT KAMU
        const DASHBOARD_URL = "https://script.google.com/macros/s/AKfycbxdwvjEoFPCjTD9StVy2ue5x7Bmkku9Mja4Hbr7uufvBlHLr1-VEn0eTA-DCPnxIn28/exec";
        const SECRET_PASS = "ri170845";

        function checkLogin() {
            const input = document.getElementById('passInput').value;
            const error = document.getElementById('errorMsg');

            if (input === SECRET_PASS) {
                window.location.href = DASHBOARD_URL;
            } else {
                error.classList.remove('hidden');
                document.getElementById('passInput').value = "";
            }
        }

        // Jalankan login saat tekan tombol Enter
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkLogin();
            }
        });
    </script>
</body>
</html>
